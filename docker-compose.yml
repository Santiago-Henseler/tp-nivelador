services:
  server:
    build:
      context: ./services/server
      dockerfile: Dockerfile
    container_name: server
    volumes:
      - ./output:/output
    ports:
      - 5678:5678
    environment:
      - PYTHONUNBUFFERED=1
      - AGENCY_QUORUM_MIN=2
      - SERVER_HOST=server
      - SERVER_PORT=5678
